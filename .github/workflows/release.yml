name: Release & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Chrome Web Store action (publish = submit for review, upload = draft only)'
        required: true
        default: 'publish'
        type: choice
        options:
          - publish
          - upload

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate extension types
        run: npx wxt prepare

      - name: Verify formatting, types, and tests
        run: |
          npm run format:check
          npm run compile
          npm test

      - name: Detect version and determine if new release
        id: check_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IS_NEW=true" >> $GITHUB_OUTPUT
            echo "Manually triggered release for version v$VERSION"
          elif git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "IS_NEW=false" >> $GITHUB_OUTPUT
            echo "Version v$VERSION already tagged. Skipping release and CWS upload."
          else
            echo "IS_NEW=true" >> $GITHUB_OUTPUT
            echo "New version detected: v$VERSION"
          fi

      - name: Build production zip packages
        if: steps.check_version.outputs.IS_NEW == 'true'
        run: npm run zip:all

      - name: Create GitHub Release
        if: steps.check_version.outputs.IS_NEW == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check_version.outputs.VERSION }}
          name: Release v${{ steps.check_version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            output/lcr-tools-extension-${{ steps.check_version.outputs.VERSION }}-chrome.zip
            output/lcr-tools-extension-${{ steps.check_version.outputs.VERSION }}-firefox.zip
            output/lcr-tools-extension-${{ steps.check_version.outputs.VERSION }}-safari.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload & Publish to Chrome Web Store
        if: steps.check_version.outputs.IS_NEW == 'true' && env.CHROME_CLIENT_ID != '' && env.CHROME_REFRESH_TOKEN != ''
        uses: mobilefirstllc/cws-publish@latest
        with:
          action: ${{ github.event.inputs.action || 'publish' }}
          client_id: ${{ secrets.CHROME_CLIENT_ID }}
          client_secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh_token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          extension_id: 'camjilfjkjmgcpmnheoeoomfndedpmbn'
          zip_file: 'output/lcr-tools-extension-${{ steps.check_version.outputs.VERSION }}-chrome.zip'
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
