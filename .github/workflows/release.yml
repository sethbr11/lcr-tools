name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      action:
        description: 'Chrome Web Store action (publish = submit for review, upload = draft only)'
        required: true
        default: 'publish'
        type: choice
        options:
          - publish
          - upload

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate extension types
        run: npx wxt prepare

      - name: Detect version and release trigger
        id: check_version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "SHOULD_RELEASE=true" >> $GITHUB_OUTPUT
            echo "Triggered by GitHub Release: $TAG (version: $VERSION)"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(node -p "require('./package.json').version")
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "SHOULD_RELEASE=true" >> $GITHUB_OUTPUT
            echo "Manually triggered release for version v$VERSION"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

            # Check if a GitHub release was already created for this tag (e.g. via GitHub Release UI)
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")

            if [ "$STATUS_CODE" = "200" ]; then
              echo "SHOULD_RELEASE=false" >> $GITHUB_OUTPUT
              echo "GitHub Release for $TAG already exists (handled by release event). Skipping duplicate tag-push workflow."
            else
              echo "SHOULD_RELEASE=true" >> $GITHUB_OUTPUT
              echo "New tag detected: $TAG (version: $VERSION). Proceeding with release."
            fi
          fi

      - name: Verify formatting, types, and tests
        if: steps.check_version.outputs.SHOULD_RELEASE == 'true'
        run: |
          npm run format:check
          npm run compile
          npm test

      - name: Build production zip packages
        if: steps.check_version.outputs.SHOULD_RELEASE == 'true'
        run: npm run zip:all

      - name: Create or Update GitHub Release
        if: steps.check_version.outputs.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check_version.outputs.VERSION }}
          name: Release v${{ steps.check_version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            output/lcr-tools-extension-${{ steps.check_version.outputs.VERSION }}-chrome.zip
            output/lcr-tools-extension-${{ steps.check_version.outputs.VERSION }}-firefox.zip
            output/lcr-tools-extension-${{ steps.check_version.outputs.VERSION }}-safari.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload & Publish to Chrome Web Store
        if: steps.check_version.outputs.SHOULD_RELEASE == 'true' && env.CHROME_CLIENT_ID != '' && env.CHROME_REFRESH_TOKEN != ''
        uses: mobilefirstllc/cws-publish@latest
        with:
          action: ${{ github.event.inputs.action || 'publish' }}
          client_id: ${{ secrets.CHROME_CLIENT_ID }}
          client_secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh_token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          extension_id: 'camjilfjkjmgcpmnheoeoomfndedpmbn'
          zip_file: 'output/lcr-tools-extension-${{ steps.check_version.outputs.VERSION }}-chrome.zip'
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
