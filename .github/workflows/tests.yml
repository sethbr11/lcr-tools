name: Tests & Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate extension types
        run: npx wxt prepare

      - name: Check code formatting
        run: npm run format:check

      - name: TypeScript strict compilation
        run: npm run compile

      - name: Run Vitest unit & integration tests
        run: npm test

      - name: Build cross-browser production bundles
        run: npm run build:all
